name: Install UPX

on:
  push:
    branches:
      - install-upx

permissions:
  contents: write

env:
  GIT_CONFIG_PARAMETERS: >-
    'user.name=Git for Windows Build Agent'
    'user.email=ci@git-for-windows.build'
    'windows.sdk64.path=${{ github.workspace }}'
    'windows.sdk32.path='
    'http.sslbackend=schannel'
    'core.autocrlf=false'
    'checkout.workers=16'
  HOME: "${{ github.workspace }}\\home\\git-ci"
  MSYSTEM: MSYS

jobs:
  install:
    runs-on: windows-latest
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Add SDK Bash to PATH
        run: "usr\\bin\\bash.exe -lc 'cygpath -aw /usr/bin >>$GITHUB_PATH'"
      - name: Install and verify UPX
        shell: bash
        run: |
          set -e
          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-upx
          /ucrt64/bin/upx.exe --version
          pacman -Q mingw-w64-ucrt-x86_64-upx
      - name: Commit SDK, remove workflow, and push
        shell: bash
        run: |
          set -e
          PATH="/c/Program Files/Git/cmd:/usr/bin:$PATH"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          run_url="$run_url/$GITHUB_RUN_ID"
          git add -A .
          if git diff --cached --quiet
          then
            echo "UPX is already installed; no SDK changes to commit."
          else
            git commit -s -m "Install UPX" \
              -m "Large DLLs can exceed GitHub's maximum allowed blob size.
          Keep UPX in the SDK so these files can be packed for storage,
          allowing the resulting SDK updates to be pushed to GitHub." \
              -m "Generated by $run_url"
          fi
          git rm -- .github/workflows/install-upx.yml
          git commit -s -m "ci: remove the one-shot UPX workflow" \
            -m "UPX installation has completed. Remove this temporary workflow
          rather than retaining a maintenance action that is no longer needed." \
            -m "Generated by $run_url"
          git push origin "HEAD:$GITHUB_REF"
