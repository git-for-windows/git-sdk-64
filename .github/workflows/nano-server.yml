name: Windows Nano Server tests

on: [workflow_dispatch, push]

jobs:
  test-nano-server:
    if: github.event.repository.fork == false || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    env:
      REF: ${{github.ref}}
      WINDBG_DIR: "C:/Program Files (x86)/Windows Kits/10/Debuggers/x64"
      IMAGE: mcr.microsoft.com/powershell:nanoserver-ltsc2022

    steps:
      - name: partial clone
        shell: bash
        run: |
          # cannot use `git clone` directly, to allow for PR's refs to be fetched
          git clone --no-checkout --single-branch -b ${REF#refs/heads/} --filter=blob:none --depth=1 \
            https://github.com/${{github.repository}} . &&
          git sparse-checkout set .github/workflows ucrt64/bin &&
          git checkout HEAD
      - name: pull nanoserver image
        shell: pwsh
        run: |
          docker pull $env:IMAGE
          $pullExitCode = $LASTEXITCODE
          if ($pullExitCode -ne 0) {
            $service = Get-Service -Name docker -ErrorAction Stop
            if ($service.Status -ne 'Stopped') { exit $pullExitCode }
            Write-Host ('Docker is stopped; starting it before ' +
              'retrying the image pull.')
            Start-Service -Name docker -ErrorAction Stop
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $info = docker info 2>&1
              if ($LASTEXITCODE -eq 0) { break }
              if ((Get-Date) -ge $deadline) {
                throw ("Docker was not ready within 60 seconds: " +
                  ($info -join [Environment]::NewLine))
              }
              Start-Sleep -Seconds 2
            } while ($true)
            docker pull $env:IMAGE
            $pullExitCode = $LASTEXITCODE
          }
          if ($pullExitCode -ne 0) { exit $pullExitCode }
      - name: run nano-server test
        shell: bash
        run: |
          docker pull $IMAGE
          docker run \
            --user "ContainerAdministrator" \
            -v "$WINDBG_DIR:C:/dbg" \
            -v "$(cygpath -aw ucrt64/bin):C:/test" \
            -v "$(cygpath -aw .github/workflows/nano-server):C:/script" \
            $IMAGE pwsh.exe C:/script/run-tests.ps1
