name: Copilot smoke test

on:
  push:
    branches: [tmp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot:
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/tmp'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install Copilot CLI
        timeout-minutes: 5
        shell: pwsh
        run: |
          New-Item -ItemType Directory copilot-smoke | Out-Null
          $null | npm.cmd install --global `
            --prefix "$env:RUNNER_TEMP\copilot-cli" @github/copilot `
            2>&1 | Tee-Object copilot-smoke\install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\copilot-cli\copilot.cmd" --version `
            2>&1 | Tee-Object copilot-smoke\version.log
          exit $LASTEXITCODE

      - name: Exercise GPT-6 Astra
        timeout-minutes: 5
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{secrets.COPILOT_GITHUB_TOKEN}}
          COPILOT_HOME: "${{runner.temp}}\\copilot-home"
        run: |
          $token = $env:COPILOT_GITHUB_TOKEN
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'COPILOT_GITHUB_TOKEN is empty.'
          }
          @{
            trailingLineBreak = $token -match '[\r\n]$'
            surroundingWhitespace = $token -cne $token.Trim()
          } | ConvertTo-Json | Tee-Object copilot-smoke\token-shape.json
          $token = $token.Trim()
          if ($token -match '[^\x21-\x7e]') {
            throw 'Token contains internal whitespace or non-ASCII characters.'
          }
          Write-Output "::add-mask::$token"
          $env:COPILOT_GITHUB_TOKEN = $token

          $prompt = 'Use the shell tool to run git --version and write ' +
            'its output to copilot-smoke/git-version.txt. Then reply ' +
            'COPILOT_SMOKE_OK. Do not perform any other task.'
          $null | & "$env:RUNNER_TEMP\copilot-cli\copilot.cmd" `
            -p $prompt --model gpt-6-astra --effort xhigh `
            --context long_context --yolo `
            --no-ask-user --no-auto-update --no-remote-export `
            --secret-env-vars=COPILOT_GITHUB_TOKEN `
            --log-dir copilot-smoke\cli-logs `
            2>&1 | Tee-Object copilot-smoke\copilot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Select-String -Path copilot-smoke\git-version.txt `
              -Pattern '^git version \d' -Quiet)) {
            throw 'Copilot did not capture the Git version.'
          }
          if (!(Select-String -Path copilot-smoke\copilot.log `
              -SimpleMatch COPILOT_SMOKE_OK -Quiet)) {
            throw 'Copilot did not return the expected response.'
          }

      - name: Upload smoke-test evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: copilot-smoke-${{github.run_id}}-${{github.run_attempt}}
          path: copilot-smoke
          if-no-files-found: error
          retention-days: 7
