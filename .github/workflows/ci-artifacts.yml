name: ci-artifacts

on:
  push:
    branches:
      - main
      - ucrt64
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number in git-for-windows/git to build'
        type: string

# For the continuous `ci-artifacts` release
permissions:
  contents: write

env:
  LC_CTYPE: C.UTF-8

jobs:
  minimal-sdk-artifact:
    if: github.event.repository.fork == false
    runs-on: windows-latest
    outputs:
      git-artifacts-extract-location: ${{ steps.git-artifacts-extract-location.outputs.result }}
    steps:
      - name: clone git-sdk-64
        run: |
          git init --bare git-sdk-64.git &&
          git --git-dir=git-sdk-64.git remote add origin https://github.com/${{github.repository}} &&
          git --git-dir=git-sdk-64.git config remote.origin.promisor true &&
          git --git-dir=git-sdk-64.git config remote.origin.partialCloneFilter blob:none &&
          git --git-dir=git-sdk-64.git fetch --depth=1 origin ${{github.sha}} &&
          git --git-dir=git-sdk-64.git update-ref --no-deref HEAD ${{github.sha}}
      - name: clone build-extra
        run: git clone --depth=1 --single-branch -b main https://github.com/git-for-windows/build-extra
      - name: build git-sdk-64-minimal-sdk
        shell: bash
        run: |
          sh -x ./build-extra/please.sh create-sdk-artifact --architecture=ucrt64 --sdk=git-sdk-64.git minimal-sdk &&
          cygpath -aw minimal-sdk/usr/bin >>$GITHUB_PATH
      - name: compress artifact
        shell: bash
        run: (cd minimal-sdk && tar cvf - * .[0-9A-Za-z]*) | gzip -1 >git-sdk-x86_64-minimal.tar.gz
      - name: upload minimal-sdk artifact
        uses: actions/upload-artifact@v7
        with:
          name: minimal-sdk
          path: git-sdk-x86_64-minimal.tar.gz
      - name: clone git-for-windows/git's `main`
        shell: bash
        run: |
          git clone --depth=1 --branch main \
            https://github.com/git-for-windows/git ../git
      - name: build current `main` of git-for-windows/git
        shell: bash
        run: |
          set -x
          . /etc/profile
          test "$(cygpath -aw /)" = "${{github.workspace}}\minimal-sdk" || exit 1
          test "$(type -p gcc)" = "/ucrt64/bin/gcc" || exit 1
          make -C ../git DEVELOPER=1 NO_PERL=1 NO_RUST=UnfortunatelyYes SKIP_DASHED_BUILT_INS=YesPlease -j8 all strip
      - name: compress git artifacts
        shell: bash
        run: tar -C .. -czf git-artifacts.tar.gz --exclude '*.a' --exclude '*.o' --exclude .git --exclude .depend git
      - name: upload git artifacts for testing
        uses: actions/upload-artifact@v7
        with:
          name: git-artifacts
          path: git-artifacts.tar.gz
      - name: determine where `git-artifacts` want to be extracted
        id: git-artifacts-extract-location
        shell: bash
        run: |
          cd .. &&
          echo "result=$(pwd)" >>$GITHUB_OUTPUT
      - name: create zip, zstd and 7z SFX variants of the minimal SDK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          for path in ucrt64/bin/7z.exe ucrt64/bin/7z.dll ucrt64/lib/7zip/7zCon.sfx
          do
            git --git-dir=git-sdk-64.git show HEAD:$path >${path##*/}
          done &&
          mkdir minimal-sdk-extra &&
          (cd minimal-sdk && /c/Windows/system32/tar.exe --zstd --options=zstd:compression-level=10 \
            -cf ../minimal-sdk-extra/git-sdk-x86_64-minimal.tar.zst * .[0-9A-Za-z]*) &&
          (cd minimal-sdk && ../7z.exe a -mmt=on -mx9 ../minimal-sdk-extra/git-sdk-x86_64-minimal.zip * .?*) &&
          (cd minimal-sdk && ../7z.exe a -t7z -mmt=on -m0=lzma -mqs -mlc=8 -mx=9 -md=256M -mfb=273 -ms=256M -sfx../7zCon.sfx \
            ../minimal-sdk-extra/git-sdk-x86_64-minimal.7z.exe * .?*)
      - name: upload minimal-sdk-extra artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: minimal-sdk-extra
          path: minimal-sdk-extra

  build-installers-artifact:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.fork == false &&
       github.event_name == 'push' &&
       github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - name: clone git-sdk-64
        run: |
          git init --bare git-sdk-64.git &&
          git --git-dir=git-sdk-64.git remote add origin https://github.com/${{github.repository}} &&
          git --git-dir=git-sdk-64.git config remote.origin.promisor true &&
          git --git-dir=git-sdk-64.git config remote.origin.partialCloneFilter blob:none &&
          git --git-dir=git-sdk-64.git fetch --depth=1 origin ${{github.sha}} &&
          git --git-dir=git-sdk-64.git update-ref --no-deref HEAD ${{github.sha}}
      - name: clone build-extra
        run: git clone --depth=1 --single-branch -b main https://github.com/git-for-windows/build-extra
      - name: build git-sdk-64-build-installers
        shell: bash
        run: sh -x ./build-extra/please.sh create-sdk-artifact --architecture=ucrt64 --sdk=git-sdk-64.git build-installers
      - name: compress artifact
        shell: bash
        run: |
          mkdir build-installers-artifacts &&
          (cd build-installers && /c/Windows/system32/tar.exe --zstd --options=zstd:compression-level=10 \
            -cf ../build-installers-artifacts/git-sdk-x86_64-build-installers.tar.zst * .[0-9A-Za-z]*)
      - name: upload build-installers artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-installers
          path: build-installers-artifacts

  build-pr-installer:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
    needs: build-installers-artifact
    runs-on: windows-latest
    env:
      GIT_CONFIG_PARAMETERS: "'checkout.workers=56'"
      HOME: "${{github.workspace}}\\home"
      USERPROFILE: "${{github.workspace}}\\home"
      MSYSTEM: UCRT64
      MINGW_PREFIX: /ucrt64
      MINGW_PACKAGE_PREFIX: mingw-w64-ucrt-x86_64
    steps:
      - name: download build-installers artifact
        uses: actions/download-artifact@v8
        with:
          name: build-installers
          path: ${{github.workspace}}
      - name: configure build-installers SDK
        shell: bash
        run: |
          mkdir build-installers &&
          /c/Windows/system32/tar.exe --zstd \
            -xf git-sdk-x86_64-build-installers.tar.zst \
            -C build-installers &&
          cygpath -aw "$PWD/build-installers/usr/bin/core_perl" \
            >>"$GITHUB_PATH" &&
          cygpath -aw "$PWD/build-installers/usr/bin" >>"$GITHUB_PATH" &&
          cygpath -aw "$PWD/build-installers/ucrt64/bin" >>"$GITHUB_PATH"
      - name: check out Git pull request and build-extra
        shell: bash
        env:
          PR_NUMBER: ${{inputs.pr_number}}
        run: |
          set -e
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Expected a positive Git PR number"
            exit 1
          }
          test "$(cygpath -aw /)" = "$(cygpath -aw "$PWD/build-installers")"
          mkdir -p "$HOME" /usr/src
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email \
            "$GITHUB_ACTOR@users.noreply.github.com"
          git clone --depth=1 --single-branch -b main \
            https://github.com/git-for-windows/build-extra /usr/src/build-extra
          git -c init.defaultBranch=main init git
          git -C git remote add -f origin https://github.com/git-for-windows/git
          git -C git fetch origin "refs/pull/$PR_NUMBER/head"
          git -C git switch --detach FETCH_HEAD
          tag_name="$(git -C git describe --match 'v[0-9]*' HEAD)"
          tag_name="$tag_name-$(date +%Y%m%d%H%M%S)"
          git -C git tag -m "Snapshot build" "$tag_name" HEAD
          echo "prerelease-${tag_name#v}" >installer-version
          snapshot="$(git -C git show -s \
            --pretty='tformat:%h (%s, %ad)' --date=short HEAD)"
          (cd /usr/src/build-extra &&
            node ./add-release-note.js --commit feature "Snapshot of $snapshot")
      - name: build Git packages from pull request
        shell: bash
        run: |
          set -e
          printf '#!/bin/sh\n\nexec /ucrt64/bin/git.exe "$@"\n' >/usr/bin/git
          PATH="/ucrt64/bin:/usr/bin:/usr/bin/core_perl:/C/Windows/system32"
          test -d /var/lib/pacman/local/$MINGW_PACKAGE_PREFIX-rust-[0-9]* &&
          rust_installed=yes ||
          rust_installed=
          if test -n "$rust_installed"
          then
            unset NO_RUST
            export DC_SHA1_RS=1
          else
            echo "::warning::Rust is not installed; building Git without Rust"
            export NO_RUST=ForNow
          fi
          cd git
          sh -x /usr/src/build-extra/please.sh build-mingw-w64-git \
            --only-ucrt64 HEAD
          if test -n "$rust_installed"
          then
            rust_src=/usr/src/MINGW-packages/mingw-w64-git/src/git
            rust_lib_dir="$rust_src/target/x86_64-pc-windows-gnu/release"
            test -s "$rust_lib_dir/libgitcore.a" || {
              echo "::error::Git's Rust library was not built"
              exit 1
            }
          fi
      - name: build Git for Windows installer
        shell: bash
        run: |
          set -e
          packages=(/usr/src/MINGW-packages/mingw-w64-git/mingw-w64-*.pkg.tar.*)
          test -f "${packages[0]}" || {
            echo "::error::No Git package archives were built"
            exit 1
          }
          package_args=()
          for package in "${packages[@]}"
          do
            case "$package" in
            *.sig|*archimport*|*cvs*|*p4*|*gitweb*|*doc-man*) continue ;;
            esac
            package_args+=("--pkg=$package")
          done
          test "${#package_args[@]}" -gt 0 || {
            echo "::error::No installer packages were built"
            exit 1
          }
          sh -x /usr/src/build-extra/please.sh \
            make_installers_from_mingw_w64_git \
            --version="$(cat installer-version)" -o installer-artifacts \
            --installer "${package_args[@]}"
      - name: upload Git for Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: git-for-windows-pr-installer
          path: installer-artifacts/*.exe
          if-no-files-found: error

  test-minimal-sdk:
    needs: minimal-sdk-artifact
    uses: ./.github/workflows/test-ci-artifacts.yml
    with:
      git-artifacts-extract-location: ${{ needs.minimal-sdk-artifact.outputs.git-artifacts-extract-location }}
    permissions:
      contents: read

  publish-release-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - test-minimal-sdk
      - build-installers-artifact
    steps:
      - name: download minimal-sdk artifact
        uses: actions/download-artifact@v8
        with:
          name: minimal-sdk
          path: ${{github.workspace}}
      - name: download minimal-sdk artifact
        uses: actions/download-artifact@v8
        with:
          name: minimal-sdk-extra
          path: ${{github.workspace}}
      - name: download build-installers artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-installers
          path: ${{github.workspace}}
      - name: publish release asset
        uses: actions/github-script@v9
        with:
          script: |
            const req = { owner: context.repo.owner, repo: context.repo.repo }
            // find or create the GitHub release named `ci-artifacts`
            const release = await (async () => {
              try {
                return await github.rest.repos.getReleaseByTag({ ...req, tag: 'ci-artifacts' });
              } catch (e) {
                if (e.status === 404) {
                  // create the `ci-artifacts` GitHub release based on the current revision
                  const workflowRunsURL = `${context.serverUrl}/${
                    process.env.GITHUB_WORKFLOW_REF.replace(/\/\.github\/workflows\/([^@]+).*/, '/actions/workflows/$1')
                  }`
                  return await github.rest.repos.createRelease({
                    ... req,
                    tag_name: 'ci-artifacts',
                    body: `Continuous release of \`ci-artifacts\`

            This release is automatically updated by the [ci-artifacts](${workflowRunsURL}) workflow.

            For technical reasons, allow up to a minute for release assets to be missing while they are updated.`,
                  });
                }
                throw e;
              }
            })()

            const fs = require('fs')
            for (const fileName of [
              'git-sdk-x86_64-minimal.tar.gz',
              'git-sdk-x86_64-minimal.tar.zst',
              'git-sdk-x86_64-minimal.zip',
              'git-sdk-x86_64-minimal.7z.exe',
              'git-sdk-x86_64-build-installers.tar.zst',
            ]) {
              console.log(`Uploading ${fileName}`)
              const uploadReq = {
                ...req,
                release_id: release.data.id,
                name: fileName,
                headers: {
                  'content-length': (await fs.promises.stat(fileName)).size,
                },
                data: fs.createReadStream(fileName),
              }

              // if the asset does not yet exist, simply upload it
              const originalAsset = release.data.assets.filter(asset => asset.name === fileName).pop()
              if (!originalAsset) {
                const asset =  await github.rest.repos.uploadReleaseAsset(uploadReq)
                console.log(`Uploaded to ${asset.data.browser_download_url}`)
                continue
              }

              // otherwise upload it using a temporary file name,
              // then delete the old asset
              // and then rename the new asset;
              // this way, the asset is not missing for a long time
              const asset = await github.rest.repos.uploadReleaseAsset({ ...uploadReq, name: `tmp.${fileName}` })
              await github.rest.repos.deleteReleaseAsset({ ...req, asset_id: originalAsset.id })
              const updatedAsset =  await github.rest.repos.updateReleaseAsset({...req,
                asset_id: asset.data.id,
                name: fileName,
                label: fileName,
              })
              console.log(`Updated ${updatedAsset.data.browser_download_url}`)
            }

            await github.rest.git.updateRef({
              ...req,
              ref: 'tags/ci-artifacts',
              sha: process.env.GITHUB_SHA,
            })
