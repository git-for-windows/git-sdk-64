name: Install Pacman packages

on:
  push:
    branches:
      - include-rust-in-makepkg-git

permissions:
  contents: write

env:
  GIT_CONFIG_PARAMETERS: >-
    'user.name=Git for Windows Build Agent'
    'user.email=ci@git-for-windows.build'
    'windows.sdk64.path=${{ github.workspace }}'
    'windows.sdk32.path='
    'http.sslbackend=schannel'
    'core.autocrlf=false'
    'checkout.workers=56'
  HOME: "${{ github.workspace }}\\home\\git-ci"
  MSYSTEM: MSYS

jobs:
  install:
    runs-on: 'windows-latest'
    environment: sync
    steps:
      - name: Check out SDK
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Add SDK Bash to PATH
        run: "usr\\bin\\bash.exe -lc 'cygpath -aw /usr/bin >>$GITHUB_PATH'"
      - name: Install Rust
        shell: bash
        run: |
          set -e
          pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-rust
      - name: Commit SDK, remove workflow, and push
        shell: bash
        run: |
          set -e
          PATH="/c/Program Files/Git/cmd:/ucrt64/bin:/usr/bin:$PATH"
          sh .github/commit-sdk.sh commit
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs"
          run_url="$run_url/$GITHUB_RUN_ID"
          git rm -- .github/workflows/install-pacman-packages.yml
          git commit -s -m "ci: retire the one-shot x86_64 Rust workflow" \
            -m "Rust is now installed via pacman, and the SDK package changes
          have been committed. Retire the workflow so later pushes to the PR
          branch do not repeat the installation." \
            -m "Generated by $run_url"
          git push origin "HEAD:$GITHUB_REF"
