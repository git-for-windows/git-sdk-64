name: git-artifacts

on:
  push:
    branches: [tmp]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: git-artifacts-${{github.ref}}
  cancel-in-progress: false

env:
  HOME: "${{github.workspace}}\\home"
  USERPROFILE: "${{github.workspace}}\\home"
  MSYSTEM: UCRT64
  ARCH_NAME: x86_64
  ARCH_BITNESS: 64
  GIT_CONFIG_PARAMETERS: "'checkout.workers=56'"
  SOURCE_RUN: '34355542074'

jobs:
  installer:
    if: >-
      github.event.repository.fork == false &&
      github.ref == 'refs/heads/tmp'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out diagnosis files only
        uses: actions/checkout@v4
        with:
          path: workflow
          sparse-checkout: |
            .github
            .sparse
          persist-credentials: false

      - name: Prepare diagnosis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force home, ci-debug | Out-Null
          Copy-Item workflow\.github\scripts\run-copilot.ps1 ci-debug
          Copy-Item workflow\.github\scripts\build-installer.sh ci-debug
          Copy-Item workflow\.github\copilot-prompts\debug-installers.md `
            ci-debug

      - name: Download the successful packages
        uses: actions/download-artifact@v8
        with:
          name: pkg-${{env.ARCH_NAME}}
          path: pkg-${{env.ARCH_NAME}}
          run-id: ${{env.SOURCE_RUN}}
          github-token: ${{github.token}}

      - name: Download the source bundles
        uses: actions/download-artifact@v8
        with:
          name: bundle-artifacts
          path: bundle-artifacts
          run-id: ${{env.SOURCE_RUN}}
          github-token: ${{github.token}}

      - name: Download the successful build's SDK
        uses: actions/download-artifact@v8
        with:
          name: build-installers.tgz
          run-id: ${{env.SOURCE_RUN}}
          github-token: ${{github.token}}

      - name: Configure Git for Windows SDK
        shell: bash
        run: |
          tar xf build-installers.tgz &&
          for bin in usr/bin/core_perl usr/bin ucrt64/bin
          do
            cygpath -aw "$PWD/build-installers/$bin" >>"$GITHUB_PATH" ||
            exit 1
          done

      - name: Install the smoke-tested Copilot CLI
        timeout-minutes: 5
        shell: pwsh
        env:
          COPILOT_HOME: "${{runner.temp}}\\copilot-home"
        run: |
          $null | npm.cmd install --global `
            --prefix "$env:RUNNER_TEMP\copilot-cli" @github/copilot@1.0.83 `
            2>&1 | Tee-Object ci-debug\copilot-setup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\copilot-cli\copilot.cmd" --version `
            2>&1 | Tee-Object ci-debug\copilot-version.log
          exit $LASTEXITCODE

      - name: Verify Copilot on this runner
        id: copilot-preflight
        timeout-minutes: 5
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{secrets.COPILOT_GITHUB_TOKEN}}
          COPILOT_HOME: "${{runner.temp}}\\copilot-home"
        run: |
          & .\ci-debug\run-copilot.ps1 -SmokeTest
          exit $LASTEXITCODE

      - name: Build UCRT64 installer
        id: build-installer
        shell: bash
        run: |
          bash --noprofile --norc -e -o pipefail \
            ci-debug/build-installer.sh </dev/null 2>&1 |
            tee ci-debug/build-installer.log

      - name: Copy package-versions and pdbs
        shell: bash
        run: |
          cp /usr/src/build-extra/installer/package-versions.txt artifacts/ &&

          a=$PWD/artifacts &&
          p=$PWD/pkg-${{env.ARCH_NAME}} &&
          (cd /usr/src/build-extra &&
          mkdir -p cached-source-packages &&
          cp "$p"/*-pdb* cached-source-packages/ &&
          GIT_CONFIG_PARAMETERS="'windows.sdk${ARCH_BITNESS}.path='" \
          ./please.sh bundle_pdbs --arch="$ARCH_NAME" \
            --directory="$a" installer/package-versions.txt)

      - name: Publish installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{env.ARCH_NAME}}
          path: artifacts
          retention-days: 5

      - name: Run the installer
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path artifacts/*.exe | %{$_.FullName}
          $arguments = '/SILENT /VERYSILENT /NORESTART ' +
            '/SUPPRESSMSGBOXES /ALLOWDOWNGRADE=1 /LOG=installer.log'
          $installer = Start-Process -PassThru -Wait -FilePath "$exePath" `
            -ArgumentList $arguments
          $exitCode = $installer.ExitCode
          if ($exitCode -ne 0) {
            Write-Host "::error::Installer failed with exit code $exitCode!"
            exit 1
          }
          "$env:ProgramFiles\Git\usr\bin" |
            Out-File -Encoding ascii -Append $env:GITHUB_PATH
          "$env:ProgramFiles\Git\ucrt64\bin" |
            Out-File -Encoding ascii -Append $env:GITHUB_PATH

      - name: Publish installer log
        if: failure() || success()
        uses: actions/upload-artifact@v7
        with:
          name: installer.log
          path: installer.log
          retention-days: 5

      - name: Validate
        shell: bash
        run: |
          echo '::group::installer.log'
          cat installer.log
          echo '::endgroup'

          set -x &&
          grep 'Installation process succeeded' installer.log &&
          ! grep -iw failed installer.log &&
          cygpath -aw / &&
          git.exe version --build-options >version &&
          cat version &&
          expected=$(sed -e 's|^v||' -e 's|-|.|g' \
            <bundle-artifacts/next_version) &&
          grep "$expected" version &&
          extra=build-installers/usr/src/build-extra &&
          checklist=$extra/installer/run-checklist.sh &&
          # cannot test SSH keys in read-only mode, skip test for now
          azure=git@ssh.dev.azure.com:v3/git-for-windows/git/git &&
          sed -i "s|$azure|https://github.com/git/git|" "$checklist" &&
          sh -x "$checklist"

      - name: Download the passing main SDK for comparison
        if: failure() && steps.copilot-preflight.outcome == 'success'
        timeout-minutes: 10
        uses: actions/download-artifact@v8
        with:
          name: build-installers.tgz
          path: main-baseline
          run-id: '34324713244'
          github-token: ${{github.token}}

      - name: Preserve the passing main logs
        if: failure() && steps.copilot-preflight.outcome == 'success'
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          $repo = 'repos/git-for-windows/git-sdk-64'
          gh api "$repo/actions/runs/34324713244/logs" `
            > ci-debug\main-logs.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive ci-debug\main-logs.zip main-baseline\logs

      - name: Diagnose and fix the installer with GPT-6 Astra
        id: copilot
        if: failure() && steps.copilot-preflight.outcome == 'success'
        timeout-minutes: 120
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{secrets.COPILOT_GITHUB_TOKEN}}
          COPILOT_HOME: "${{runner.temp}}\\copilot-home"
        run: |
          & .\ci-debug\run-copilot.ps1 `
            -PromptFile ci-debug/debug-installers.md
          exit $LASTEXITCODE

      - name: Archive runner diagnosis
        if: always()
        timeout-minutes: 10
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{steps.build-installer.outcome}}
          COPILOT_OUTCOME: ${{steps.copilot.outcome}}
        run: |
          New-Item -ItemType Directory -Force ci-debug | Out-Null
          @{
            sourceRun = $env:SOURCE_RUN
            build = $env:BUILD_OUTCOME
            copilot = $env:COPILOT_OUTCOME
          } | ConvertTo-Json | Set-Content ci-debug\outcomes.json
          $sessions = "$env:RUNNER_TEMP\copilot-home\session-state"
          if (Test-Path $sessions) {
            Compress-Archive -Path $sessions `
              -DestinationPath ci-debug\copilot-session.zip
          }
          if (Test-Path artifacts) {
            New-Item -ItemType Directory -Force `
              ci-debug\verified-artifacts | Out-Null
            Copy-Item artifacts\* ci-debug\verified-artifacts -Recurse -Force
          }
          git -C workflow diff --binary HEAD -- > ci-debug\sdk.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extra = 'build-installers\usr\src\build-extra'
          if (Test-Path "$extra\.git") {
            git -C $extra diff --binary HEAD -- > ci-debug\build-extra.patch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload runner diagnosis
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: copilot-debug-${{github.run_id}}-${{github.run_attempt}}
          path: ci-debug
          if-no-files-found: error
          retention-days: 7
